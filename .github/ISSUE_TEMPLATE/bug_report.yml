name: Bug report
description: Report a wrong finding, a missed finding or a crash.
title: "bug: "
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
        - label: My example contains no real secrets or personal data
          required: true
  - type: input
    id: version
    attributes:
      label: mcp-audit version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A sanitized config snippet (fake secrets only) and the command you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
